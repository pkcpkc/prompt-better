name: iosAIBridge
options:
  bundleIdPrefix: ai
  deploymentTarget:
    iOS: 26.0
packages:
  Vapor:
    url: https://github.com/vapor/vapor.git
    from: 4.89.0
  AIBridgeKit:
    path: ../Shared
targets:
  iosAIBridge:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
    dependencies:
      - package: Vapor
        product: Vapor
      - package: AIBridgeKit
        product: AIBridgeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.iosAIBridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/App/Info.plist

schemes:
  iosAIBridge:
    build:
      targets:
        iosAIBridge: all
    run:
      config: Debug
